version: 2

project_name: envm

before:
  hooks:
    - go test ./...

builds:
  - id: envm
    main: ./cmd/envm
    binary: envm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X martinshaw.co/environment-manager/cmd/envm.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: martinshaw
    name: environment-manager
